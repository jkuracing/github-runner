# Replicas are declared explicitly rather than via `deploy.replicas` because
# every replica of a scaled service shares one set of volumes, and NOTHING here
# is safe to share between concurrently building runners:
#
#   - sccache keeps its LRU index in memory per server process, so several
#     containers on one cache DIRECTORY evict against each other. This is why
#     the shared sccache below is reached over S3 instead: a server backend has
#     no such per-process index, so sharing it is safe where a directory is not.
#   - The cargo registry was shared here initially and caused real CI failures:
#       error: could not compile `crc32fast` (lib)
#       Caused by: could not execute process `.../bin/rustc --crate-name
#         crc32fast .../registry/src/index.crates.io-*/crc32fast-1.5.0/src/lib.rs`
#       Caused by: No such file or directory (os error 2)
#     Unpacked sources under registry/src vanish mid-compile when another
#     container's cargo garbage-collects the global cache, so the spawn fails on
#     a working directory that no longer exists. Cargo's package-cache lock does
#     not protect a build for its whole duration across separate containers.
#
# Each runner therefore gets its own cargo registry volume, which is only
# expressible as its own service. The cost is N copies of the crate downloads.
#
# sccache is the exception and is now SHARED, via the `sccache-s3` service below.
# Twelve private caches would each have to warm from scratch, so the first build
# on every replica stayed cold -- most of what a cache exists to prevent. The
# per-replica sccache volumes that used to be mounted here are gone: with an S3
# backend sccache keeps no local cache directory.
#
# `docker compose up -d --build` starts all 12. To run fewer, name them:
#   docker compose up -d --build runner-1 runner-2 runner-3
#
# `docker compose build` MUST be run with no service argument. Each service
# declares its own `build: .`, so compose tags a separate image per service, and
# `docker compose build runner-1` silently leaves the others on the old image --
# they still start and register, so nothing looks wrong until a job needs a tool
# only the rebuilt image has.
x-runner: &runner
  build: .
  # `on-failure:5` used to be the policy here and it cost the fleet ten days of
  # downtime: a bug in entrypoint.sh's config cleanup made every replica exit 1
  # on restart, the five retries were spent in seconds, and Docker then left all
  # containers dead with no surviving process to notice. A runner fleet
  # should heal rather than latch off, and the entrypoint mints a fresh
  # registration token per start, so a genuinely broken image loops visibly in
  # the logs instead of failing silently.
  restart: unless-stopped
  stop_grace_period: 5m
  # Ordering only, deliberately NOT `condition: service_healthy`. Gating twelve
  # runners on the cache's health would turn an optimisation into a single point
  # of failure for the whole fleet -- a sick MinIO would mean no CI at all rather
  # than slow CI. entrypoint.sh probes the bucket itself and degrades to
  # wrapper-less builds if it cannot be reached.
  depends_on: [sccache-s3]
  # Anchored separately so a service can override ONE variable (the amd64 lane
  # overrides RUNNER_LABELS) without restating the whole block: merging
  # `<<: *runner` and then giving `environment:` would replace the mapping
  # wholesale, silently dropping URL, GITHUB_PAT and the cargo knobs.
  environment: &runner-env
    URL: ${URL}
    GITHUB_PAT: ${GITHUB_PAT}
    # Defaulted to empty: entrypoint.sh prefers GITHUB_PAT and only falls back
    # to a static token, but an unset variable makes `docker compose` print a
    # warning per service per invocation -- noise that buries the real errors
    # underneath.
    RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    RUNNER_NAME: ${RUNNER_NAME:-}
    # A runner is offered a job only when its label set is a SUPERSET of the
    # job's `runs-on`. Both labels therefore go on every replica: splitting them
    # across replicas would leave some containers ineligible for hbf jobs and
    # idle whenever hbf work is all that is queued. firmware_ci.yml asks for
    # [fw-builder]; hbf asks for [hbf-builder]; every replica can serve either.
    RUNNER_LABELS: ${RUNNER_LABELS:-fw-builder,hbf-builder}
    # Match cargo's internal parallelism to this replica's CPU allotment.
    # cargo defaults to one codegen unit per *host* core, so without this each
    # replica would spawn ~16 threads and every replica would oversubscribe the
    # machine. The cpus limit below only throttles the result; capping the thread
    # count is what actually avoids the thrashing.
    CARGO_BUILD_JOBS: ${RUNNER_CPUS:-2}
    # Disk, not memory or CPU, is what this fleet runs out of. Measured
    # 2026-08-09 with the host volume down to 294 MB free: the 12 container
    # writable layers held 170 GB, and 85% of that was ONE directory per
    # replica -- hbf's target/ at 11-13 GB (firmware's is 0.9 GB). The
    # per-replica cargo registry and sccache volumes that this file goes to
    # such lengths to keep separate are only ~29 GB combined, so they are not
    # the problem and sharing them would not fix it. target/ cannot be shared
    # at all: cargo takes an exclusive lock per target directory, so one
    # shared dir would serialise all 12 replicas and destroy the parallelism
    # that is the entire point of the fleet. The lever is to make each target/
    # smaller, not fewer of them.
    #
    # The cargo knobs that act on this -- CARGO_INCREMENTAL and
    # CARGO_PROFILE_DEV_DEBUG -- are deliberately NOT set here, and
    # entrypoint.sh owns their defaults instead. A value set in this file only
    # reaches a job once `up -d` RECREATES the container, which destroys _work
    # and with it the warm target/ dir on the writable layer -- the very thing
    # being economised. Exported from the entrypoint, a plain `docker restart`
    # applies them and keeps the caches. Add either name here to override, and
    # see entrypoint.sh for why /actions-runner/.env cannot serve this purpose.
    #
    # Setting them on the fleet rather than in either repo's workflow keeps
    # hosted runners and developer laptops unaffected. Neither repo sets
    # CARGO_INCREMENTAL, so the fleet's value is what a job sees.
    #
    # sccache was DEAD here until 2026-08-09 -- absent from the image, no
    # RUSTC_WRAPPER ever set, and 1.1 GB per replica of cache last written
    # 2026-07-28. That is why wiping a target/ dir used to mean a genuinely cold
    # rebuild. It is now installed in the image and wired to the shared bucket by
    # entrypoint.sh, which enables the wrapper only if that bucket answers, so a
    # cache outage degrades build speed instead of failing CI.
    #
    # CARGO_INCREMENTAL=0 is a PREREQUISITE for it, not a rival: sccache cannot
    # cache incrementally compiled units and silently bypasses them.
    #
    # What sccache does NOT do is shrink target/ -- the rlibs and test
    # executables still land there at full size, so a warm fleet returns to
    # roughly 140 GB. It makes deleting those dirs cheap, which is what makes a
    # recurring sweep affordable. Disk stays bounded by sccache AND the sweep
    # together; neither suffices alone.
  deploy:
    resources:
      limits:
        # 12 replicas at 2 CPU / 4 GB on a 16-core / 64 GB host.
        #
        # This block previously read "Memory is the binding constraint, not CPU"
        # at 8 x 6 GB. Measured under a full load of firmware and hbf jobs, that
        # was wrong on both counts: peak usage across all replicas was 756 MiB
        # against the 6 GiB limit -- an 8x overshoot -- and only 4 of 8
        # containers were computing at all (~195% CPU each), the rest sitting
        # near idle on network and setup. Roughly half the host's cores were
        # unused while jobs queued.
        #
        # The real constraint was SLOTS. An hbf run measured 16.8 minutes of job
        # time inside an 11.8 minute span -- an average concurrency of 1.4 --
        # because firmware held 7 of the 8 slots. So: more, smaller replicas.
        #
        # Total memory is unchanged at 48 GB of the ~58 GB the VM exposes. CPU is
        # deliberately oversubscribed 1.5:1 (12 x 2 = 24 on 16 cores), which the
        # observed idle time justifies.
        #
        # DISK is now the limiting factor, not memory: each replica keeps its own
        # target/ for both repositories. At 12 replicas this reached 170 GB of
        # container layers and took the host volume down to 294 MB free, which
        # does not fail as "out of disk" -- it surfaces as
        # `collect2: ld terminated with signal 7 [Bus error]`, the linker dying
        # mid-write. hbf's own ci.yml documents the same symptom on hosted
        # runners. Treat any inexplicable linker or codegen failure across
        # several replicas as a disk check first.
        #
        # See CARGO_INCREMENTAL / CARGO_PROFILE_DEV_DEBUG above for the fix, and
        # note it is PROSPECTIVE: existing target/ dirs keep their incremental
        # state and fat debuginfo until rebuilt, so landing those variables
        # reclaims nothing on its own. Run `docker system df` before going wider.
        cpus: ${RUNNER_CPUS:-2}
        memory: ${RUNNER_MEMORY:-4g}

services:
  # The one cache all 12 replicas share. See the header comment for why this is
  # S3 rather than a shared directory, and why the cargo registry deliberately is
  # NOT shared the same way.
  #
  # MinIO is used in preference to Redis because a compilation cache of this size
  # belongs on disk: Redis would hold the whole thing in RAM, and 48 of the VM's
  # ~58 GB is already committed to the replicas, so it would compete with the
  # builds it is meant to accelerate.
  #
  # Not published to the host. Only the runners need it, and the fleet's compose
  # network is enough -- exposing an unauthenticated-by-default object store on a
  # laptop's interfaces would be a poor trade for a build cache.
  sccache-s3:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${SCCACHE_ACCESS_KEY:-sccache}
      MINIO_ROOT_PASSWORD: ${SCCACHE_SECRET_KEY:-sccache-secret}
    volumes: [sccache-s3-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Creates the bucket and, more importantly, BOUNDS it. sccache has a built-in
  # LRU for a local cache directory (SCCACHE_CACHE_SIZE) but none whatsoever for
  # an S3 backend -- it never deletes anything it uploads. Left alone this bucket
  # would grow without limit and become the disk problem it was added to solve.
  #
  # Expiry by age rather than a hard quota is the primary bound: a hard quota
  # makes writes start failing once reached, which sccache reports as errors on
  # every miss, whereas expiry keeps the working set and simply forgets what has
  # not been useful lately. 14 days comfortably covers a fortnight of branches
  # while capping the bucket at roughly one fortnight of unique compilations.
  # The quota is a generous backstop against a pathological week.
  #
  # Runs to completion and exits; `restart: "no"` keeps it from looping.
  sccache-s3-init:
    image: minio/mc:latest
    depends_on:
      sccache-s3:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set fleet http://sccache-s3:9000
      '${SCCACHE_ACCESS_KEY:-sccache}' '${SCCACHE_SECRET_KEY:-sccache-secret}' &&
      mc mb --ignore-existing fleet/sccache &&
      mc ilm rule add --expire-days 14 fleet/sccache 2>/dev/null || true &&
      mc quota set fleet/sccache --size ${SCCACHE_MAX_SIZE:-20GiB} 2>/dev/null || true &&
      echo 'sccache bucket ready:' && mc du fleet/sccache
      "

  runner-1:
    <<: *runner
    volumes: [cargo-registry-1:/home/runner/.cargo/registry]
  runner-2:
    <<: *runner
    volumes: [cargo-registry-2:/home/runner/.cargo/registry]
  runner-3:
    <<: *runner
    volumes: [cargo-registry-3:/home/runner/.cargo/registry]
  runner-4:
    <<: *runner
    volumes: [cargo-registry-4:/home/runner/.cargo/registry]
  runner-5:
    <<: *runner
    volumes: [cargo-registry-5:/home/runner/.cargo/registry]
  runner-6:
    <<: *runner
    volumes: [cargo-registry-6:/home/runner/.cargo/registry]
  runner-7:
    <<: *runner
    volumes: [cargo-registry-7:/home/runner/.cargo/registry]
  runner-8:
    <<: *runner
    volumes: [cargo-registry-8:/home/runner/.cargo/registry]
  runner-9:
    <<: *runner
    volumes: [cargo-registry-9:/home/runner/.cargo/registry]
  runner-10:
    <<: *runner
    volumes: [cargo-registry-10:/home/runner/.cargo/registry]
  runner-11:
    <<: *runner
    volumes: [cargo-registry-11:/home/runner/.cargo/registry]
  runner-12:
    <<: *runner
    volumes: [cargo-registry-12:/home/runner/.cargo/registry]

  # x86_64 runners, on the same Apple Silicon host.
  #
  # OrbStack runs linux/amd64 containers through Rosetta rather than qemu, so
  # this is translation at roughly native speed rather than emulation at a
  # tenth of it -- verified on this host: `docker run --platform linux/amd64
  # alpine uname -m` reports x86_64.
  #
  # Why a native-ish amd64 runner instead of cross-compiling from aarch64:
  # hbf's binaries pull in tokio-serial -> serialport, which links libudev on
  # Linux. cargo-zigbuild supplies a cross C toolchain but NOT an x86_64
  # libudev sysroot, so a cross build needs a multiarch sysroot maintained by
  # hand. Building on an amd64 runner needs neither -- the image already
  # installs libudev-dev for whatever architecture it is built for.
  #
  # A DISTINCT label, not the shared pair: a runner is offered a job when its
  # labels are a superset of the job's `runs-on`, so giving these
  # `hbf-builder` would let ordinary aarch64 work land on a translated x86_64
  # container and run slower for no reason. Only jobs that explicitly want
  # x86_64 should come here.
  #
  # Two replicas, not twelve. x86_64 artifacts are published from pushes to
  # main rather than from every PR, so this is a low-duty-cycle lane; it is
  # sized to not compete with the aarch64 fleet for the host.
  runner-amd64-1:
    <<: *runner
    platform: linux/amd64
    environment:
      <<: *runner-env
      RUNNER_LABELS: ${RUNNER_LABELS_AMD64:-hbf-builder-amd64,fw-builder-amd64}
    volumes: [cargo-registry-amd64-1:/home/runner/.cargo/registry]
  runner-amd64-2:
    <<: *runner
    platform: linux/amd64
    environment:
      <<: *runner-env
      RUNNER_LABELS: ${RUNNER_LABELS_AMD64:-hbf-builder-amd64,fw-builder-amd64}
    volumes: [cargo-registry-amd64-2:/home/runner/.cargo/registry]

volumes:
  # The single shared compilation cache, bounded by the ilm rule and quota that
  # sccache-s3-init applies. Replaces the twelve per-replica sccache volumes.
  sccache-s3-data:
  cargo-registry-1:
  cargo-registry-2:
  cargo-registry-3:
  cargo-registry-4:
  cargo-registry-5:
  cargo-registry-6:
  cargo-registry-7:
  cargo-registry-8:
  cargo-registry-9:
  cargo-registry-10:
  cargo-registry-11:
  cargo-registry-12:
  cargo-registry-amd64-1:
  cargo-registry-amd64-2:
